[workspace]
resolver = "2"
members = [
    "crates/vkdg-core",
    "crates/vkdg-operations",
    "crates/vkdg-http",
    "crates/vkdg-routing",
    "crates/vkdg-connections",
    "crates/vkdg-ingress-anthropic",
    "crates/vkdg-observe",
    "crates/vkdg-cli",
    "crates/vkdg-plugin-host",
    "crates/vkdg-storage",
    "bin/vkdg",
    "tests/conformance",
    "plugins/providers/anthropic",
    "plugins/providers/openai",
    "crates/vkdg-provider-sdk",
    "crates/vkdg-ingress-openai",
    "crates/vkdg-jobs",
    "crates/vkdg-artifacts",
    "crates/vkdg-policy-compress",
    "crates/vkdg-config",
    "crates/vkdg-admin",
    "crates/vkdg-cache",
    "crates/vkdg-memory",
    "crates/vkdg-eval",
    "crates/vkdg-free-tier",
    "crates/vkdg-governance",
    "plugins/providers/gemini",
    "plugins/providers/groq",
    "plugins/providers/together",
    "plugins/providers/fireworks",
    "plugins/providers/deepseek",
    "plugins/providers/mistral",
    "plugins/providers/claude-code",
    "plugins/providers/codex",
    "plugins/providers/kiro",
    "plugins/providers/kimi-coding",
    "plugins/providers/antigravity",
    "plugins/providers/github-copilot",
    "plugins/providers/sambanova",
    "plugins/providers/cerebras",
    "plugins/providers/nvidia-nim",
    "bench",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codeatlasdev/vkdg"

[workspace.dependencies]
# async runtime
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# http
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
bytes = "1.10"
crc32fast = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
console   = "0.15"
indicatif = "0.17"

# tower middleware
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }

# axum for routing surface
axum = { version = "0.8", features = ["macros"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# config
figment = { version = "0.10", features = ["yaml", "env"] }

# errors
thiserror = "2.0"
anyhow = "1.0"

# tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27" }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"

# ids / time
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# crypto
aes-gcm = "0.10"
sha2             = "0.10"
# Admin console password hashing (PHC string, memory-hard).
argon2           = "=0.5.3"
rand = "0.8"

# cli
clap = { version = "4.5", features = ["derive", "env"] }

# async utils
futures = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"
parking_lot = "0.12"


# internal crates
vkdg-core        = { path = "crates/vkdg-core" }
vkdg-operations  = { path = "crates/vkdg-operations" }
vkdg-http        = { path = "crates/vkdg-http" }
vkdg-routing     = { path = "crates/vkdg-routing" }
vkdg-connections = { path = "crates/vkdg-connections" }
vkdg-ingress-anthropic = { path = "crates/vkdg-ingress-anthropic" }
vkdg-observe     = { path = "crates/vkdg-observe" }
vkdg-plugin-host = { path = "crates/vkdg-plugin-host" }
vkdg-storage     = { path = "crates/vkdg-storage" }
serde_yaml      = "0.9"
vkdg-cli        = { path = "crates/vkdg-cli" }
vkdg-provider-anthropic = { path = "plugins/providers/anthropic" }
vkdg-ingress-openai     = { path = "crates/vkdg-ingress-openai" }
vkdg-provider-openai    = { path = "plugins/providers/openai" }
vkdg-jobs        = { path = "crates/vkdg-jobs" }
vkdg-artifacts   = { path = "crates/vkdg-artifacts" }
vkdg-policy-compress = { path = "crates/vkdg-policy-compress" }
vkdg-config      = { path = "crates/vkdg-config" }
vkdg-admin       = { path = "crates/vkdg-admin" }
vkdg-cache       = { path = "crates/vkdg-cache" }
vkdg-combos      = { path = "crates/vkdg-combos" }
vkdg-memory      = { path = "crates/vkdg-memory" }
vkdg-eval       = { path = "crates/vkdg-eval" }
vkdg-free-tier   = { path = "crates/vkdg-free-tier" }
vkdg-governance  = { path = "crates/vkdg-governance" }
vkdg-provider-sdk       = { path = "crates/vkdg-provider-sdk" }
vkdg-provider-gemini    = { path = "plugins/providers/gemini" }
vkdg-provider-groq      = { path = "plugins/providers/groq" }
vkdg-provider-together  = { path = "plugins/providers/together" }
vkdg-provider-fireworks = { path = "plugins/providers/fireworks" }
vkdg-provider-deepseek  = { path = "plugins/providers/deepseek" }
vkdg-provider-mistral   = { path = "plugins/providers/mistral" }
vkdg-provider-claude-code  = { path = "plugins/providers/claude-code" }
vkdg-provider-codex     = { path = "plugins/providers/codex" }
vkdg-provider-kiro      = { path = "plugins/providers/kiro" }
vkdg-provider-kimi-coding  = { path = "plugins/providers/kimi-coding" }
vkdg-provider-antigravity   = { path = "plugins/providers/antigravity" }
vkdg-provider-github-copilot = { path = "plugins/providers/github-copilot" }
vkdg-provider-sambanova      = { path = "plugins/providers/sambanova" }
vkdg-provider-cerebras       = { path = "plugins/providers/cerebras" }
vkdg-provider-nvidia-nim     = { path = "plugins/providers/nvidia-nim" }
notify           = { version = "6.1", features = ["macos_fsevent"] }
rusqlite         = { version = "0.31", features = ["bundled"] }
wasmtime        = { version = "27", features = ["component-model"] }
wasmtime-wasi   = "27"
wit-parser      = "0.227"
wat             = "1"
tempfile         = "3.10"
criterion = { version = "0.5", features = ["async_tokio"] }
regex            = "1.11"
urlencoding      = "2.1"
redis            = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rust-embed   = { version = "8", features = ["mime-guess"] }
axum-embed   = "0.1.0"
inquire      = { version = "0.9.4", default-features = false, features = ["crossterm"] }
self_update  = { version = "1.3.0", default-features = false, features = ["archive-tar", "compression-tar-gz", "rustls", "github", "reqwest"] }


[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Allow overrides for known-noisy pedantic/nursery lints in a gateway codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
use_self = "allow"
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
wildcard_imports = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
# Explicit per-variant arms (e.g. VkdgError → HTTP status) document each mapping;
# merging them hides intent and makes future divergence harder to review.
match_same_arms = "allow"
# `..Default::default()` in struct literals is idiomatic; naming the type adds noise.
default_trait_access = "allow"

[profile.dev]
opt-level = 1
# macOS: emits .dSYM separately instead of embedding debug info in .rlib.
# Reduces target/debug by ~20-30%. Silently ignored on Windows/Linux.
# Backtraces and rust-analyzer work unchanged.
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
