# _typos.toml
# typos-cli configuration.
# typos uses a known-bad-word list, not a dictionary — very low false positive rate.
# https://github.com/crate-ci/typos

[default]
locale = "en"

[default.extend-identifiers]
# Project-specific identifiers that look like typos to the checker.
vkdg = "vkdg"
VKDG = "VKDG"

[default.extend-words]
# café appears in the SSE parser UTF-8 boundary test as a multi-byte test fixture.
caf = "caf"

[files]
extend-exclude = [
    "Cargo.lock",
    "*.snap",
    "bun.lockb",
]
