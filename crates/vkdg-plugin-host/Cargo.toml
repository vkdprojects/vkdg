[package]
name = "vkdg-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vkdg-core       = { workspace = true }
vkdg-operations = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
anyhow          = { workspace = true }
tokio           = { workspace = true }
wasmtime        = { workspace = true }
bytes           = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[package.metadata.cargo-machete]
# These deps are used by Wasmtime internals, WASM component loading,
# or test fixtures — machete cannot detect macro/indirect usage.
ignored = ["anyhow", "bytes", "serde_json", "tokio", "vkdg-core", "vkdg-operations"]
