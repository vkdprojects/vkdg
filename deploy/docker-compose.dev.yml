services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      VKDG_ADMIN_ADDR: "0.0.0.0:9090"
      VKDG_BOOTSTRAP_TOKEN: "dev-bootstrap-token"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  console:
    build:
      context: ../apps/console
      dockerfile: ../../deploy/Dockerfile.console
    ports:
      - "5173:3000"
    environment:
      VKDG_ADMIN_URL: "http://gateway:9090"
      ORIGIN: "http://localhost:5173"
    depends_on:
      - gateway
