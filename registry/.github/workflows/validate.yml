name: Validate plugin manifests

on:
  pull_request:
    paths: ['plugins/**/*.yaml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install vkdg
        run: |
          curl -fsSL https://raw.githubusercontent.com/vkdprojects/vkdg/main/install.sh | sh

      - name: Validate changed manifests
        run: |
          git diff --name-only origin/main...HEAD | grep 'plugins/.*\.yaml' | while read f; do
            echo "Validating $f..."
            vkdg plugin validate-manifest "$f"
          done
