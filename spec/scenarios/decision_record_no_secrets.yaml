id: decision_record_no_secrets
title: DecisionRecord never leaks access_token or raw request body
contract: The DecisionRecord emitted after any request (success, failure, or cancellation) must not contain the connection's access_token, API key, or the raw request body content
phase: Completed  # applies to all terminal states

arrange:
  connections:
    - id: conn-001
      model: claude-3-5-sonnet-20241022
      healthy: true
      access_token: "sk-secret-token-that-must-not-appear-in-record"
  admission_limit: 100
  upstream_behavior:
    conn-001:
      action: respond
      status: 200
      headers:
        content-type: application/json
      body: >
        {
          "id": "msg_01",
          "type": "message",
          "role": "assistant",
          "content": [{"type": "text", "text": "ok"}],
          "model": "claude-3-5-sonnet-20241022",
          "stop_reason": "end_turn",
          "usage": {"input_tokens": 5, "output_tokens": 1}
        }

act:
  request:
    method: POST
    path: /v1/messages
    headers:
      content-type: application/json
      x-client-id: client-test
      x-tenant-id: tenant-test
      authorization: "Bearer client-api-key-must-not-leak"
    body:
      model: claude-3-5-sonnet-20241022
      max_tokens: 100
      messages:
        - role: user
          content: "My SSN is 123-45-6789"  # sensitive user content

assert:
  http_status: 200
  decision_record_must_not_contain:
    - "sk-secret-token-that-must-not-appear-in-record"
    - "client-api-key-must-not-leak"
    - "123-45-6789"
    - "My SSN is"
  invariants:
    - "DecisionRecord serialized to JSON contains no access_token field or value"
    - "DecisionRecord contains no Authorization header value"
    - "DecisionRecord contains no raw request body or message content"
    - "connection_chosen field contains only ConnectionId (opaque identifier), not credentials"
    - "state_transitions contain only AttemptState enum variants and timestamps, no payload data"
    - "DecisionRecord is safe to write to structured logs without a secrets scrubber"
