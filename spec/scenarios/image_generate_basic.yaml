id: image_generate_basic
title: POST /v1/images/generations returns URL of the generated image
contract: Operation::ImageGenerate is routed to the provider; response contains a non-empty url
phase: provider

arrange:
  connections:
    - id: openai-images
      provider: openai
      auth:
        type: api_key
        env_var: OPENAI_API_KEY
      models: ["dall-e-*"]
  upstream_behavior:
    type: static_json
    body:
      created: 1234567890
      data:
        - url: "https://example.com/img.png"

act:
  request:
    method: POST
    path: /v1/images/generations
    headers:
      content-type: application/json
    body:
      model: "dall-e-3"
      prompt: "a cat"
      n: 1
      size: "1024x1024"

assert:
  http_status: 200
  invariants:
    - response contains numeric "created" field
    - response contains non-empty "data[0].url"
    - request_id present in response headers (x-request-id) or body
