id: slow_client_no_unbounded_buffer
title: Slow client does not cause unbounded memory growth in the gateway
contract: When upstream produces chunks faster than the client consumes them, TCP backpressure propagates upstream and the gateway process RSS does not grow unboundedly
phase: Committed

arrange:
  connections:
    - id: conn-001
      model: claude-3-5-sonnet-20241022
      healthy: true
  admission_limit: 100
  upstream_behavior:
    conn-001:
      action: stream_sse
      chunk_count: 1000
      chunk_interval_ms: 10        # upstream sends 1 chunk every 10ms (100 chunks/sec)
      chunk_size_bytes: 256
  client_behavior:
    read_rate: 1_chunk_per_second  # client reads 1 chunk per second (100x slower than upstream)

act:
  request:
    method: POST
    path: /v1/messages
    headers:
      content-type: application/json
      x-client-id: client-test
      x-tenant-id: tenant-test
    body:
      model: claude-3-5-sonnet-20241022
      max_tokens: 10000
      stream: true
      messages:
        - role: user
          content: write a very long essay

assert:
  memory_bound:
    baseline_rss_mb: measured_before_request
    max_growth_mb: 2          # RSS must not grow more than 2MB above baseline
    measured_after_chunks: 10 # measured after client has consumed 10 chunks
  invariants:
    - "TCP backpressure propagates to upstream read loop — upstream is not read ahead unboundedly"
    - "No Vec accumulation of unread chunks in gateway memory"
    - "Gateway does not buffer all 1000 upstream chunks before client reads any"
    - "Process RSS growth after 10 client-side consumed chunks is <= 2MB above baseline"
    - "Upstream connection is flow-controlled, not drained eagerly"
